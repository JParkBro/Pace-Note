<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>M10 계정 - Running App</title>
<!-- Load Tailwind CSS v3 with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for custom theme colors -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#0D0F09',
            surface: '#161911',
            accent: '#C8F53A',
            danger: '#F87171',
            subdued: '#8E9285',
            divider: '#23271B'
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- Custom Stylesheet for subtle touch effects and precise dimensions -->
<style data-purpose="custom-styling">
    body {
      background-color: #050604;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Mobile frame preview container */
    .mobile-frame {
      width: 360px;
      height: 800px;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-black text-white antialiased">
<!-- BEGIN: MobileContainer -->
<!-- 360x800 Mobile viewport representing Android viewport -->
<div class="mobile-frame bg-obsidian flex flex-col justify-between shadow-2xl relative select-none">
<!-- Top Content Area -->
<div class="w-full flex flex-col">
<!-- BEGIN: AndroidStatusBar -->
<!-- Android system status bar area -->
<div class="w-full h-7 px-5 pt-2 flex justify-between items-center text-xs text-subdued select-none" data-purpose="status-bar">
<span class="font-medium text-[12px] tracking-tight text-white">09:41</span>
<div class="flex items-center space-x-1.5 opacity-80">
<!-- Wi-Fi Icon -->
<svg class="w-3.5 h-3.5 fill-current text-white" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.27 0 6.27 1.25 8.54 3.29L12 19.33 3.46 10.79C5.73 8.75 8.73 7.5 12 7.5z"></path>
</svg>
<!-- Battery Icon -->
<svg class="w-4 h-4 fill-current text-white" viewbox="0 0 24 24">
<path d="M17 5v14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h1V1h4v2h1a2 2 0 0 1 2 2zm-2 1H9v14h6V6z"></path>
</svg>
</div>
</div>
<!-- END: AndroidStatusBar -->
<!-- BEGIN: TopAppBar -->
<!-- Header with back button and screen title '계정' -->
<header class="w-full h-14 px-4 flex items-center gap-3">
<button aria-label="뒤로 가기" class="p-1 -ml-1 text-white hover:opacity-80 active:scale-95 transition-transform" type="button">
<svg class="w-6 h-6 stroke-current stroke-2" fill="none" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7"></path>
</svg>
</button>
<h1 class="text-[19px] font-semibold text-white tracking-tight">계정</h1>
</header>
<!-- END: TopAppBar -->
<!-- BEGIN: MainContent -->
<main class="w-full px-4 pt-2 flex flex-col gap-3">
<!-- Account Info Card (Surface container) -->
<section class="bg-surface rounded-2xl p-4 flex flex-col justify-center border border-white/5" data-purpose="account-card">
<span class="text-white text-[16px] font-bold tracking-tight">runner@gmail.com</span>
<span class="text-subdued text-[13px] mt-1 font-normal">Google 계정</span>
</section>
<!-- Logout Action Row -->
<section class="w-full mt-1">
<button class="w-full py-3.5 px-1 flex items-center justify-between group active:opacity-70 transition-opacity" data-purpose="logout-button" type="button">
<span class="text-[15px] font-normal text-white">로그아웃</span>
<!-- Small subtle right chevron -->
<svg class="w-4 h-4 text-subdued/80 stroke-current stroke-2 group-hover:translate-x-0.5 transition-transform" fill="none" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<path d="M9 18l6-6-6-6"></path>
</svg>
</button>
<!-- Subtle separator line -->
<div class="w-full h-[1px] bg-white/[0.06]"></div>
</section>
</main>
<!-- END: MainContent -->
</div>
<!-- BEGIN: BottomActions -->
<!-- Screen bottom containing danger button '회원 탈퇴' and navigation bar indicator -->
<footer class="w-full pb-7 pt-4 flex flex-col items-center justify-end">
<!-- Delete Account / Unregister Danger Button -->
<button class="text-danger text-[13px] font-medium tracking-tight px-4 py-2 hover:opacity-80 active:opacity-60 transition-opacity" data-purpose="delete-account" type="button">
        회원 탈퇴
      </button>
<!-- Android Gesture Pill / Safe Area Home Indicator -->
<div class="w-32 h-1 bg-white/20 rounded-full mt-3"></div>
</footer>
<!-- END: BottomActions -->
</div>
<!-- END: MobileContainer -->
</body></html>
