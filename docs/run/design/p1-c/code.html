<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100..900&display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#12140e;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-variant": "#34362e", "on-secondary-fixed": "#002111", "on-tertiary": "#2a3414", "tertiary": "#ffffff", "on-surface-variant": "#c4c9ae", "on-primary-container": "#556d00", "on-primary-fixed": "#161f00", "secondary-fixed": "#9ef5c0", "primary-fixed": "#c6f338", "outline": "#8e937b", "error-container": "#93000a", "tertiary-container": "#dbe8ba", "primary-container": "#c6f338", "inverse-surface": "#e3e3d8", "on-secondary": "#003920", "background": "#12140e", "surface-container": "#1e201a", "on-primary": "#283500", "error": "#ffb4ab", "inverse-primary": "#506600", "secondary": "#82d8a5", "on-tertiary-fixed": "#151f03", "on-error": "#690005", "primary": "#ffffff", "tertiary-fixed-dim": "#bfcca0", "secondary-fixed-dim": "#82d8a5", "surface-bright": "#383a32", "inverse-on-surface": "#2f312a", "on-tertiary-container": "#5d6944", "outline-variant": "#444935", "secondary-container": "#006a40", "primary-fixed-dim": "#abd611", "on-error-container": "#ffdad6", "surface-container-low": "#1a1c16", "on-surface": "#e3e3d8", "surface-dim": "#12140e", "surface-container-highest": "#34362e", "on-secondary-fixed-variant": "#005231", "surface-tint": "#abd611", "on-primary-fixed-variant": "#3c4d00", "on-background": "#e3e3d8", "surface-container-high": "#292b24", "on-tertiary-fixed-variant": "#404b29", "surface": "#12140e", "tertiary-fixed": "#dbe8ba", "surface-container-lowest": "#0d0f09", "on-secondary-container": "#90e7b2" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xs": "0.25rem", "gutter-sm": "0.5rem", "space-lg": "1.25rem", "gutter": "0.75rem", "space-sm": "0.5rem", "space-xl": "1.75rem", "margin-sm": "0.75rem", "space-md": "1rem", "margin": "1rem" }, "fontFamily": { "body-sm": ["Pretendard"], "headline-sm": ["Pretendard"], "display-hero-mobile": ["Pretendard"], "headline-md": ["Pretendard"], "headline-lg": ["Pretendard"], "body-md": ["Pretendard"], "body-lg": ["Pretendard"], "metric-large": ["Pretendard"], "label-lg": ["Pretendard"], "display-hero": ["Pretendard"], "label-md": ["Pretendard"], "label-sm": ["Pretendard"], "metric-medium": ["Pretendard"] }, "fontSize": { "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }], "headline-sm": ["16px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "600" }], "display-hero-mobile": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "headline-md": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-lg": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "metric-large": ["36px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-lg": ["15px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "600" }], "display-hero": ["56px", { "lineHeight": "60px", "letterSpacing": "-0.04em", "fontWeight": "700" }], "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "500" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "metric-medium": ["26px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }] } } } };</script><style>

  </head><body class="bg-surface-container-lowest text-on-surface font-body-md text-body-md flex flex-col min-h-screen selection:bg-primary-fixed selection:text-on-primary-fixed"><header class="fixed top-0 inset-x-0 z-50 bg-surface-container-lowest/80 backdrop-blur-xl pt-safe"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="뒤로 가기" class="w-11 h-11 -ml-space-xs rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight truncate">Gps Calibration</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface-container-lowest"><div class="flex flex-col w-full px-margin justify-between min-h-[calc(100vh-4rem)] select-none">
<!-- Status & Environmental Context -->
<div class="pt-space-sm flex justify-center items-center">
<div class="inline-flex items-center gap-space-xs px-space-md py-1 rounded-full bg-surface-container-low">
<span class="w-1.5 h-1.5 rounded-full bg-secondary-fixed animate-ping"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase">GPS Search · 고감도 보정 중</span>
</div>
</div>
<!-- Center Content: GPS Scanning Delight -->
<div class="flex flex-col items-center justify-center my-auto py-space-xl">
<!-- Signal Bars Graphic -->
<div class="relative flex items-center justify-center w-32 h-32 mb-space-lg">
<!-- Ambient Radar Waves -->
<div class="absolute inset-0 rounded-full bg-secondary-fixed/5 animate-pulse"></div>
<div class="absolute w-24 h-24 rounded-full bg-secondary-fixed/10"></div>
<!-- 4 Ascending Signal Bars -->
<div class="relative z-10 flex items-end justify-center gap-1.5 h-16 w-20">
<!-- Bar 1 (Active) -->
<div class="w-3 h-4 rounded-full bg-primary transition-all duration-500 ease-out shadow-sm"></div>
<!-- Bar 2 (Active) -->
<div class="w-3 h-7 rounded-full bg-primary transition-all duration-500 ease-out shadow-sm"></div>
<!-- Bar 3 (Active Pulse) -->
<div class="w-3 h-11 rounded-full bg-primary transition-all duration-500 ease-out shadow-sm"></div>
<!-- Bar 4 (Searching/Inactive) -->
<div class="w-3 h-16 rounded-full bg-surface-variant transition-all duration-700 ease-in-out" id="searching-bar"></div>
</div>
</div>
<!-- Text Group -->
<div class="flex flex-col items-center text-center space-y-space-xs max-w-xs">
<h2 class="font-headline-lg text-headline-lg text-primary tracking-tight">
        GPS 신호를 찾고 있어요
      </h2>
<p class="font-body-md text-body-md text-on-surface-variant">
        하늘이 트인 곳이 잘 잡혀요
      </p>
</div>
<!-- Micro-Telemetry Pill -->
<div class="mt-space-lg flex items-center gap-space-sm px-space-md py-space-xs rounded-xl bg-surface-container">
<span class="material-symbols-outlined text-[18px] text-secondary">explore</span>
<span class="font-body-sm text-body-sm text-on-surface-variant tabular-nums" id="accuracy-text">현재 위성 탐색률 75%</span>
</div>
</div>
<!-- Bottom CTA Actions (No tab bar, pinned rhythm) -->
<div class="w-full flex flex-col gap-space-sm pb-8 pt-space-md">
<!-- Disabled Primary Button: 시작 -->
<button class="w-full h-14 rounded-xl font-label-lg text-label-lg flex items-center justify-center transition-all duration-300 bg-surface-variant/40 text-outline cursor-not-allowed" disabled="" id="btn-start" type="button">
<span class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-[20px]">directions_run</span>
<span>시작</span>
</span>
</button>
<!-- Fallback Action: 신호 없이 시작 -->
<button class="w-full h-14 rounded-xl font-label-lg text-label-lg flex items-center justify-center bg-surface-container-high text-on-surface hover:bg-surface-bright active:scale-[0.99] transition-all" id="btn-force-start" onclick="startInstantly()" type="button">
      신호 없이 시작
    </button>
<!-- Subdued Hint -->
<p class="font-label-sm text-label-sm text-center text-outline">
      실내 또는 지하 통로인 경우 즉시 시작을 권장해요
    </p>
</div>
</div>
<script>
  // Dynamic Delight Micro-Interaction: Realistic Satellite Lock Simulation
  (function() {
    const searchingBar = document.getElementById('searching-bar');
    const accuracyText = document.getElementById('accuracy-text');
    const startBtn = document.getElementById('btn-start');

    let count = 0;
    const interval = setInterval(() => {
      count++;
      if (count === 3) {
        if (accuracyText) accuracyText.textContent = "위성 4기 신호 동기화 중...";
      }
      if (count === 5) {
        clearInterval(interval);
        // Lock acquired state
        if (searchingBar) {
          searchingBar.classList.remove('bg-surface-variant');
          searchingBar.classList.add('bg-primary-container', 'shadow-sm');
        }
        if (accuracyText) {
          accuracyText.textContent = "GPS 신호 확보 완료 (정확도 높음)";
          accuracyText.classList.remove('text-on-surface-variant');
          accuracyText.classList.add('text-secondary');
        }
        if (startBtn) {
          startBtn.removeAttribute('disabled');
          startBtn.classList.remove('bg-surface-variant/40', 'text-outline', 'cursor-not-allowed');
          startBtn.classList.add('bg-primary-container', 'text-on-primary-container', 'hover:brightness-105', 'active:scale-[0.99]');
        }
      }
    }, 1100);
  })();

  function startInstantly() {
    const forceBtn = document.getElementById('btn-force-start');
    if (forceBtn) {
      forceBtn.textContent = "러닝 세션 준비 중...";
      forceBtn.classList.add('opacity-70');
    }
  }
</script></main></body></html>
