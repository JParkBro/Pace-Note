<!DOCTYPE html>

<html class="dark" lang="ko"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

eight": "400" }], "headline-lg": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }] } } } }</script></head><body class="bg-surface-container-lowest text-on-surface min-h-screen flex flex-col pt-safe pb-safe px-safe selection:bg-primary-fixed selection:text-on-primary-fixed"><main class="flex-1 flex flex-col relative w-full bg-surface-container-lowest"><div class="flex flex-col w-full px-margin pb-6 max-w-[360px] mx-auto select-none">
<!-- Top Navigation & Stage Visual -->
<div class="flex items-center justify-between pt-2 pb-2">
<button aria-label="뒤로가기" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors active:opacity-70" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex items-center gap-1.5 pr-1">
<span class="w-6 h-1 rounded-full bg-primary-fixed"></span>
<span class="w-1.5 h-1 rounded-full bg-surface-variant"></span>
<span class="w-1.5 h-1 rounded-full bg-surface-variant"></span>
</div>
</div>
<!-- Introspective Visual Banner Matching Image Context -->
<div class="relative w-full rounded-xl overflow-hidden mb-4 bg-surface-container-low">
<img alt="러닝 무드 비주얼" class="w-full aspect-[1028/559] object-cover opacity-90" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB-YvF7lO4EOkGsN7fCl4vcZcJq8KO8lvjgPOg2HdLoT-0P-ZPF5ltfVzh3x8fc_YACxNgYWfvjPnBwQazMWr9CZnXfXXPbdoxR0jSOS1xBagZBbNRKdQWw_aAG57y3v01EfulPk5rNNY18jCqPEJTaJ7sTE1dxmV69u-SOdr0YKqppI70_G2VQ0u1dHEOwzdC-09OCvedyOupUO4AJEb4EWeKrN8TaoUnVYvoJRlew5QpcMeVQVTle"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest via-transparent to-transparent"></div>
<div class="absolute bottom-2.5 left-3">
<span class="font-label-sm text-label-sm text-secondary tracking-widest uppercase">STEP 01</span>
</div>
</div>
<!-- Header Area -->
<div class="flex flex-col mb-5">
<h1 class="font-headline-lg text-headline-lg text-on-surface">약관 동의</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">
      오롯이 나의 호흡과 달림에 집중하기 위해 약관에 동의해 주세요.
    </p>
</div>
<!-- 전체 동의 Card -->
<div class="w-full bg-surface-container-low rounded-xl p-4 flex items-center justify-between mb-3 cursor-pointer active:scale-[0.99] transition-all" id="agree-all-box" role="button" tabindex="0">
<div class="flex items-center gap-3">
<div class="w-6 h-6 rounded-lg flex items-center justify-center bg-surface-variant text-transparent transition-colors" id="agree-all-icon">
<span class="material-symbols-outlined text-[18px]">check</span>
</div>
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-on-surface">전체 동의</span>
<span class="font-label-sm text-label-sm text-outline">필수 및 선택 항목 일괄 동의</span>
</div>
</div>
<div class="w-7 h-7 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">done_all</span>
</div>
</div>
<!-- Terms Agreement List -->
<div class="flex flex-col gap-1 bg-surface-container-low/60 rounded-xl p-2.5 mb-6">
<!-- Item 1: 만 14세 이상 -->
<div class="flex items-center justify-between py-2 px-1 rounded-lg">
<label class="flex items-center gap-3 flex-1 cursor-pointer">
<input class="term-check term-req hidden" id="term-age" type="checkbox"/>
<span class="check-box w-5 h-5 rounded-md flex items-center justify-center bg-surface-variant text-transparent transition-colors shrink-0">
<span class="material-symbols-outlined text-[15px]">check</span>
</span>
<span class="font-body-md text-body-md text-on-surface flex items-center gap-1.5">
<span class="font-label-md text-label-md text-secondary">[필수]</span>
<span>만 14세 이상입니다</span>
</span>
</label>
</div>
<!-- Item 2: 서비스 이용약관 -->
<div class="flex items-center justify-between py-2 px-1 rounded-lg">
<label class="flex items-center gap-3 flex-1 cursor-pointer">
<input class="term-check term-req hidden" id="term-service" type="checkbox"/>
<span class="check-box w-5 h-5 rounded-md flex items-center justify-center bg-surface-variant text-transparent transition-colors shrink-0">
<span class="material-symbols-outlined text-[15px]">check</span>
</span>
<span class="font-body-md text-body-md text-on-surface flex items-center gap-1.5">
<span class="font-label-md text-label-md text-secondary">[필수]</span>
<span>서비스 이용약관</span>
</span>
</label>
<button aria-label="서비스 이용약관 상세 보기" class="w-8 h-8 flex items-center justify-center text-outline hover:text-on-surface active:opacity-60" type="button">
<span class="material-symbols-outlined text-[18px]">chevron_right</span>
</button>
</div>
<!-- Item 3: 개인정보 처리방침 -->
<div class="flex items-center justify-between py-2 px-1 rounded-lg">
<label class="flex items-center gap-3 flex-1 cursor-pointer">
<input class="term-check term-req hidden" id="term-privacy" type="checkbox"/>
<span class="check-box w-5 h-5 rounded-md flex items-center justify-center bg-surface-variant text-transparent transition-colors shrink-0">
<span class="material-symbols-outlined text-[15px]">check</span>
</span>
<span class="font-body-md text-body-md text-on-surface flex items-center gap-1.5">
<span class="font-label-md text-label-md text-secondary">[필수]</span>
<span>개인정보 처리방침</span>
</span>
</label>
<button aria-label="개인정보 처리방침 상세 보기" class="w-8 h-8 flex items-center justify-center text-outline hover:text-on-surface active:opacity-60" type="button">
<span class="material-symbols-outlined text-[18px]">chevron_right</span>
</button>
</div>
<!-- Item 4: 위치정보 이용약관 -->
<div class="flex items-center justify-between py-2 px-1 rounded-lg">
<label class="flex items-center gap-3 flex-1 cursor-pointer">
<input class="term-check term-req hidden" id="term-location" type="checkbox"/>
<span class="check-box w-5 h-5 rounded-md flex items-center justify-center bg-surface-variant text-transparent transition-colors shrink-0">
<span class="material-symbols-outlined text-[15px]">check</span>
</span>
<span class="font-body-md text-body-md text-on-surface flex items-center gap-1.5">
<span class="font-label-md text-label-md text-secondary">[필수]</span>
<span>위치정보 이용약관</span>
</span>
</label>
<button aria-label="위치정보 이용약관 상세 보기" class="w-8 h-8 flex items-center justify-center text-outline hover:text-on-surface active:opacity-60" type="button">
<span class="material-symbols-outlined text-[18px]">chevron_right</span>
</button>
</div>
<!-- Item 5: 마케팅 정보 수신 (선택) -->
<div class="flex items-center justify-between py-2 px-1 rounded-lg">
<label class="flex items-center gap-3 flex-1 cursor-pointer">
<input class="term-check hidden" id="term-marketing" type="checkbox"/>
<span class="check-box w-5 h-5 rounded-md flex items-center justify-center bg-surface-variant text-transparent transition-colors shrink-0">
<span class="material-symbols-outlined text-[15px]">check</span>
</span>
<span class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1.5">
<span class="font-label-md text-label-md text-outline">[선택]</span>
<span>마케팅 정보 수신</span>
</span>
</label>
<button aria-label="마케팅 정보 수신 상세 보기" class="w-8 h-8 flex items-center justify-center text-outline hover:text-on-surface active:opacity-60" type="button">
<span class="material-symbols-outlined text-[18px]">chevron_right</span>
</button>
</div>
</div>
<!-- Bottom Action Button Area -->
<div class="w-full mt-auto pt-2">
<button class="w-full h-14 rounded-[14px] bg-surface-container-high text-outline font-headline-sm text-headline-sm flex items-center justify-center transition-all cursor-not-allowed select-none" disabled="" id="submit-btn" type="button">
      동의하고 계속
    </button>
</div>
</div>
<script>
  (function () {
    const agreeAllBox = document.getElementById('agree-all-box');
    const agreeAllIcon = document.getElementById('agree-all-icon');
    const checkboxes = Array.from(document.querySelectorAll('.term-check'));
    const requiredCheckboxes = Array.from(document.querySelectorAll('.term-req'));
    const submitBtn = document.getElementById('submit-btn');

    function updateVisual(checkbox) {
      const box = checkbox.parentElement.querySelector('.check-box');
      if (checkbox.checked) {
        box.classList.remove('bg-surface-variant', 'text-transparent');
        box.classList.add('bg-primary-fixed', 'text-on-primary-fixed');
      } else {
        box.classList.remove('bg-primary-fixed', 'text-on-primary-fixed');
        box.classList.add('bg-surface-variant', 'text-transparent');
      }
    }

    function syncState() {
      checkboxes.forEach(updateVisual);

      const allChecked = checkboxes.every(cb => cb.checked);
      if (allChecked) {
        agreeAllIcon.classList.remove('bg-surface-variant', 'text-transparent');
        agreeAllIcon.classList.add('bg-primary-fixed', 'text-on-primary-fixed');
      } else {
        agreeAllIcon.classList.remove('bg-primary-fixed', 'text-on-primary-fixed');
        agreeAllIcon.classList.add('bg-surface-variant', 'text-transparent');
      }

      const reqSatisfied = requiredCheckboxes.every(cb => cb.checked);
      if (reqSatisfied) {
        submitBtn.disabled = false;
        submitBtn.className = "w-full h-14 rounded-[14px] bg-primary-fixed text-on-primary-fixed font-headline-sm text-headline-sm flex items-center justify-center transition-all active:scale-[0.99] cursor-pointer";
      } else {
        submitBtn.disabled = true;
        submitBtn.className = "w-full h-14 rounded-[14px] bg-surface-container-high text-outline font-headline-sm text-headline-sm flex items-center justify-center transition-all cursor-not-allowed";
      }
    }

    agreeAllBox.addEventListener('click', () => {
      const allChecked = checkboxes.every(cb => cb.checked);
      const nextState = !allChecked;
      checkboxes.forEach(cb => { cb.checked = nextState; });
      syncState();
    });

    checkboxes.forEach(cb => {
      cb.addEventListener('change', syncState);
    });

    submitBtn.addEventListener('click', () => {
      if (!submitBtn.disabled) {
        submitBtn.textContent = '처리 중...';
        setTimeout(() => {
          submitBtn.textContent = '다음 단계로 이동';
        }, 500);
      }
    });

    syncState();
  })();
</script></main></body></html>
