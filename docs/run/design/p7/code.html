<span class="material-symbols-outlined text-primary-fixed text-[18px]">check_circle</span>
<span id="toastMsg">클립보드에 카드가 복사되었습니다.</span>
</div>

<script>
  let activeBg = 'default';
  const metricState = {
    distance: true,
    time: true,
    pace: true,
    date: false
  };

  function setBg(type) {
    activeBg = type;
    const preview = document.getElementById('cardPreview');
    const photoLayer = document.getElementById('photoBackgroundLayer');
    const transLayer = document.getElementById('transparentGridLayer');
    const bgStatus = document.getElementById('bgStatus');

    const btns = ['default', 'photo', 'transparent'];
    btns.forEach(b => {
      const el = document.getElementById('bgBtn-' + b);
      if (b === type) {
        el.className = 'px-space-md py-1.5 rounded-full font-label-md text-label-md transition-all font-semibold bg-on-surface text-surface-container-lowest';
      } else {
        el.className = 'px-space-md py-1.5 rounded-full font-label-md text-label-md transition-all font-medium bg-surface-container-high text-on-surface-variant hover:text-on-surface';
      }
    });

    if (type === 'default') {
      preview.className = 'w-full max-w-[328px] aspect-[4/3] rounded-xl bg-surface-container-low p-space-lg relative flex flex-col justify-between overflow-hidden shadow-xl transition-all duration-300';
      photoLayer.style.opacity = '0';
      transLayer.style.opacity = '0';
      bgStatus.textContent = '단색 매트';
    } else if (type === 'photo') {
      preview.className = 'w-full max-w-[328px] aspect-[4/3] rounded-xl bg-surface-container-lowest p-space-lg relative flex flex-col justify-between overflow-hidden shadow-xl transition-all duration-300';
      photoLayer.style.opacity = '1';
      transLayer.style.opacity = '0';
      bgStatus.textContent = '배경 사진 적용';
    } else if (type === 'transparent') {
      preview.className = 'w-full max-w-[328px] aspect-[4/3] rounded-xl bg-surface-container-lowest/40 backdrop-blur-md p-space-lg relative flex flex-col justify-between overflow-hidden shadow-xl transition-all duration-300';
      photoLayer.style.opacity = '0';
      transLayer.style.opacity = '1';
      bgStatus.textContent = '인스타 스토리 스티커 PNG';
    }
  }

  function toggleMetric(key) {
    metricState[key] = !metricState[key];
    const btn = document.getElementById('pill-' + key);
    const checkIcon = btn.querySelector('.material-symbols-outlined');

    if (metricState[key]) {
      btn.className = 'px-space-md py-1.5 rounded-full font-label-md text-label-md transition-all font-semibold bg-on-surface text-surface-container-lowest flex items-center gap-1';
      if (checkIcon) checkIcon.classList.remove('hidden');
    } else {
      btn.className = 'px-space-md py-1.5 rounded-full font-label-md text-label-md transition-all font-medium bg-surface-container-high text-on-surface-variant flex items-center gap-1';
      if (checkIcon) checkIcon.classList.add('hidden');
    }

    renderCardMetrics();
  }

  function renderCardMetrics() {
    const distEl = document.getElementById('statDistance');
    const timeEl = document.getElementById('metricTime');
    const paceEl = document.getElementById('metricPace');
    const divEl = document.getElementById('metricDivider');
    const dateEl = document.getElementById('statDate');
    const metricsRow = document.getElementById('statMetrics');

    if (distEl) distEl.style.display = metricState.distance ? 'flex' : 'none';
    if (timeEl) timeEl.style.display = metricState.time ? 'inline' : 'none';
    if (paceEl) paceEl.style.display = metricState.pace ? 'inline' : 'none';
    if (divEl) divEl.style.display = (metricState.time && metricState.pace) ? 'inline' : 'none';
    if (metricsRow) metricsRow.style.display = (!metricState.time && !metricState.pace) ? 'none' : 'flex';
    if (dateEl) dateEl.style.display = metricState.date ? 'block' : 'none';
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    toastMsg.textContent = msg;
    toast.style.opacity = '1';
    toast.style.transform = 'translate(-50%, -8px)';
    
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translate(-50%, 0)';
    }, 2400);
  }

  function handleSave() {
    const btn = document.getElementById('btnSave');
    btn.classList.add('opacity-70');
    setTimeout(() => {
      btn.classList.remove('opacity-70');
      showToast(activeBg === 'transparent' ? '투명 PNG 이미지가 갤러리에 저장되었습니다' : '러닝 카드가 갤러리에 저장되었습니다');
    }, 400);
  }

  function handleShare() {
    if (navigator.share) {
      navigator.share({
        title: '오늘의 모닝 러닝 기록',
        text: '5.21 km 러닝 완료! 30:12 페이스 5\'48"',
        url: window.location.href
      }).catch(() => {
        showToast('공유 링크가 클립보드에 복사되었습니다');
      });
    } else {
      showToast('러닝 카드가 클립보드에 복사되었습니다');
    }
  }

  renderCardMetrics();
</script></main></body></html>
