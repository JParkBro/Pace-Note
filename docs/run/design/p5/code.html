<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100..900&display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-tertiary-fixed": "#151f03", "tertiary-container": "#dbe8ba", "inverse-on-surface": "#2f312a", "on-primary-container": "#556d00", "on-primary-fixed-variant": "#3c4d00", "error-container": "#93000a", "on-error": "#690005", "secondary-container": "#006a40", "surface-container": "#1e201a", "tertiary-fixed": "#dbe8ba", "on-secondary-container": "#90e7b2", "primary-fixed": "#c6f338", "surface-container-lowest": "#0d0f09", "on-secondary-fixed": "#002111", "outline": "#8e937b", "tertiary-fixed-dim": "#bfcca0", "surface-container-low": "#1a1c16", "on-tertiary-container": "#5d6944", "surface-tint": "#abd611", "outline-variant": "#444935", "secondary": "#82d8a5", "background": "#12140e", "surface-container-high": "#292b24", "on-tertiary": "#2a3414", "surface": "#12140e", "on-secondary-fixed-variant": "#005231", "on-secondary": "#003920", "on-primary-fixed": "#161f00", "secondary-fixed": "#9ef5c0", "surface-container-highest": "#34362e", "tertiary": "#ffffff", "primary-fixed-dim": "#abd611", "surface-bright": "#383a32", "on-tertiary-fixed-variant": "#404b29", "secondary-fixed-dim": "#82d8a5", "on-surface": "#e3e3d8", "on-surface-variant": "#c4c9ae", "on-primary": "#283500", "on-background": "#e3e3d8", "primary": "#ffffff", "surface-variant": "#34362e", "inverse-surface": "#e3e3d8", "error": "#ffb4ab", "inverse-primary": "#506600", "on-error-container": "#ffdad6", "surface-dim": "#12140e", "primary-container": "#c6f338" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-sm": "0.5rem", "space-xs": "0.25rem", "space-xl": "1.75rem", "space-md": "1rem", "gutter": "0.75rem", "space-lg": "1.25rem", "margin": "1rem", "margin-sm": "0.75rem", "gutter-sm": "0.5rem" }, fontFamily: { "body-sm": ["Pretendard"], "metric-medium": ["Pretendard"], "headline-lg": ["Pretendard"], "metric-large": ["Pretendard"], "label-md": ["Pretendard"], "headline-sm": ["Pretendard"], "body-md": ["Pretendard"], "headline-md": ["Pretendard"], "display-hero-mobile": ["Pretendard"], "label-sm": ["Pretendard"], "body-lg": ["Pretendard"], "display-hero": ["Pretendard"], "label-lg": ["Pretendard"] }, fontSize: { "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }], "metric-medium": ["26px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "headline-lg": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "metric-large": ["36px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "500" }], "headline-sm": ["16px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-md": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "display-hero-mobile": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "display-hero": ["56px", { "lineHeight": "60px", "letterSpacing": "-0.04em", "fontWeight": "700" }], "label-lg": ["15px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "600" }] } } } };</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#0d0f09;color:#e3e3d8;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface-container-lowest font-body-md text-body-md text-on-surface pt-safe pb-safe flex flex-col min-h-screen"><main class="flex flex-col relative w-full bg-surface-container-lowest min-h-screen flex-1"><div class="flex flex-col w-full relative select-none">
<!-- Paused Running View Behind Modal -->
<div class="flex flex-col w-full px-margin pt-space-md opacity-40 filter blur-[1px]">
<!-- Top Telemetry Status -->
<div class="flex items-center justify-between py-space-xs">
<div class="flex items-center gap-space-xs bg-surface-container px-space-sm py-1 rounded-full">
<span class="w-2 h-2 rounded-full bg-primary-fixed animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant">일시정지됨</span>
</div>
<div class="flex items-center gap-space-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">location_on</span>
<span class="font-label-sm text-label-sm">GPS 양호</span>
</div>
</div>
<!-- Hero Distance Telemetry -->
<div class="flex flex-col items-center justify-center my-space-lg">
<span class="font-label-md text-label-md text-on-surface-variant mb-1">거리 (킬로미터)</span>
<div class="flex items-baseline">
<span class="font-display-hero-mobile text-display-hero-mobile text-on-surface tracking-tighter tabular-nums font-bold">3.42</span>
<span class="font-headline-sm text-headline-sm text-outline ml-1">km</span>
</div>
</div>
<!-- Secondary Split Metrics -->
<div class="grid grid-cols-2 gap-gutter mb-space-lg">
<div class="bg-surface-container-low p-space-md rounded-xl flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-1">시간</span>
<span class="font-metric-medium text-metric-medium text-on-surface tabular-nums">20:31</span>
</div>
<div class="bg-surface-container-low p-space-md rounded-xl flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-1">평균 페이스</span>
<span class="font-metric-medium text-metric-medium text-on-surface tabular-nums">5'58"</span>
</div>
</div>
<!-- Minimalist Vector GPS Route Canvas -->
<div class="bg-surface-container-low h-44 rounded-xl p-space-md flex flex-col justify-between relative overflow-hidden mb-space-lg">
<div class="flex justify-between items-center z-10">
<span class="font-label-sm text-label-sm text-on-surface-variant">실시간 경로</span>
<span class="font-label-sm text-label-sm text-outline tabular-nums">고도 +18m</span>
</div>
<!-- Vector Polyline Track -->
<svg class="absolute inset-0 w-full h-full p-4 pointer-events-none" fill="none" viewbox="0 0 320 160">
<path d="M 40 120 C 60 90, 80 130, 110 80 C 140 30, 180 100, 210 50 C 230 20, 270 70, 280 40" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
<circle cx="40" cy="120" fill="#c6f338" r="4"></circle>
<circle cx="280" cy="40" fill="#FFFFFF" r="5"></circle>
<circle cx="280" cy="40" opacity="0.4" r="9" stroke="#FFFFFF" stroke-width="1.5"></circle>
</svg>
<div class="flex items-center gap-space-xs z-10 text-outline">
<span class="font-label-sm text-label-sm">도심 코스 1</span>
</div>
</div>
<!-- Background Inactive Controls -->
<div class="grid grid-cols-2 gap-gutter">
<div class="h-14 bg-surface-container rounded-xl flex items-center justify-center text-on-surface font-headline-sm text-headline-sm">
        재개
      </div>
<div class="h-14 bg-surface-container rounded-xl flex items-center justify-center text-error font-headline-sm text-headline-sm">
        종료
      </div>
</div>
</div>
<!-- Dimmed Modal Backdrop Overlay -->
<div class="absolute inset-0 bg-surface-container-lowest/80 backdrop-blur-sm z-20 transition-opacity duration-200" id="backdrop"></div>
<!-- P5 Bottom Modal Sheet Container -->
<section aria-labelledby="modal-finish-title" aria-modal="true" class="absolute bottom-0 inset-x-0 z-30 flex flex-col bg-surface-container-high rounded-t-[28px] px-6 pt-3 pb-8 shadow-2xl transition-transform duration-200 ease-out" role="dialog">
<!-- Top Pill Drag Indicator -->
<div class="w-10 h-1 rounded-full bg-outline-variant mx-auto mb-5 opacity-60"></div>
<!-- Text Block -->
<div class="flex flex-col mb-6">
<h2 class="font-headline-lg text-headline-lg text-on-surface tracking-tight font-bold" id="modal-finish-title">
        러닝을 마칠까요?
      </h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1.5 tabular-nums" id="run-summary-text">
        3.42km · 20:31
      </p>
</div>
<!-- Action Group -->
<div class="flex flex-col gap-3 w-full">
<!-- Primary Save & Finish CTA -->
<button class="w-full h-14 bg-primary-fixed hover:bg-primary-fixed-dim active:scale-[0.98] rounded-[14px] flex items-center justify-center gap-2 transition-all duration-150 cursor-pointer" id="btn-save-finish" type="button">
<span class="material-symbols-outlined text-on-primary-fixed text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-headline-sm text-headline-sm text-on-primary-fixed font-bold tracking-tight">저장하고 마치기</span>
</button>
<!-- Secondary Resume CTA -->
<button class="w-full h-14 bg-surface-container active:scale-[0.98] rounded-[14px] flex items-center justify-center gap-2 transition-all duration-150 cursor-pointer" id="btn-resume-run" type="button">
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">계속 달리기</span>
</button>
</div>
</section>
</div>
<script>
  (function() {
    const resumeBtn = document.getElementById('btn-resume-run');
    const saveBtn = document.getElementById('btn-save-finish');
    const backdrop = document.getElementById('backdrop');

    if (resumeBtn) {
      resumeBtn.addEventListener('click', () => {
        resumeBtn.classList.add('opacity-70');
        setTimeout(() => {
          resumeBtn.classList.remove('opacity-70');
        }, 150);
      });
    }

    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        saveBtn.classList.add('opacity-80');
        setTimeout(() => {
          saveBtn.classList.remove('opacity-80');
        }, 150);
      });
    }

    if (backdrop) {
      backdrop.addEventListener('click', () => {
        if (resumeBtn) {
          resumeBtn.click();
        }
      });
    }
  })();
</script></main></body></html>
