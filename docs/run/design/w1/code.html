<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>W1 홈 위젯 - Android Home Screen Preview</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            widgetBg: '#FFFFFF',
            launcherBg: '#64748B',
            darkPill: '#121212',
            iconPlaceholder: '#94A3B8'
          },
          borderRadius: {
            '3xl': '28px',
            '4xl': '36px'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Pretendard', 'Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="base-layout">
    body {
      background-color: #0F172A;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Roboto', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Simulated Mobile Frame */
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      height: 800px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 0 10px #1E293B;
    }
  </style>
<style data-purpose="wallpaper-effects">
    /* Subtle Android launcher wallpaper styling */
    .android-wallpaper {
      background: radial-gradient(circle at 50% 20%, #64748b 0%, #475569 50%, #334155 100%);
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body>
<!-- BEGIN: MobileDeviceFrame -->
<main class="mobile-frame android-wallpaper rounded-4xl flex flex-col justify-between p-5 select-none" data-purpose="mobile-screen">
<!-- BEGIN: AndroidStatusBar -->
<header class="w-full flex items-center justify-between text-white/90 text-xs px-2 pt-2" data-purpose="status-bar">
<!-- Current Time -->
<span class="font-medium tracking-tight text-[13px]">12:45</span>
<!-- System Status Icons -->
<div class="flex items-center space-x-2 text-[11px]">
<!-- Signal Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 14c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"></path>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0 0 12 4zm0 3.2c3.55 0 6.8 1.34 9.27 3.55L12 19.1 2.73 10.75C5.2 8.54 8.45 7.2 12 7.2z"></path>
</svg>
<!-- Battery Icon -->
<div class="flex items-center space-x-0.5">
<span class="text-[10px] font-semibold mr-0.5">85%</span>
<div class="w-4 h-2.5 border border-white/80 rounded-sm p-0.5 flex items-center">
<div class="w-2.5 h-full bg-white rounded-2xs"></div>
</div>
</div>
</div>
</header>
<!-- END: AndroidStatusBar -->
<!-- BEGIN: MainContentArea -->
<div class="w-full flex flex-col items-center mt-6">
<!-- Google / Date Glance Mini Bar (Android typical top detail) -->
<div class="w-full px-4 mb-4 flex items-center justify-between text-white/70 text-xs" data-purpose="date-indicator">
<span>5월 18일 일요일</span>
<span>22°C 맑음</span>
</div>
<!-- BEGIN: GlanceWidget4x2 -->
<!-- Android 4x2 Glance Widget: W1 홈 위젯 -->
<section aria-label="주간 러닝 목표 위젯" class="w-full bg-widgetBg rounded-3xl p-5 shadow-xl transition-transform active:scale-[0.99] cursor-pointer" data-purpose="glance-home-widget" role="region">
<!-- Subtitle & Category -->
<div class="flex items-center justify-between mb-1.5">
<span class="text-xs font-semibold text-neutral-500 tracking-tight">이번 주</span>
<span class="w-2 h-2 rounded-full bg-emerald-500" title="동기화 완료"></span>
</div>
<!-- Distance Counter -->
<div class="mb-3.5">
<h2 class="text-2xl font-black tracking-tight text-neutral-900 leading-none">
            12.4 <span class="text-base font-semibold text-neutral-400">/ 15 km</span>
</h2>
</div>
<!-- Progress Bar Container -->
<div class="w-full bg-neutral-200 h-2.5 rounded-full overflow-hidden mb-4" data-purpose="goal-progress-bar">
<!-- 12.4 / 15 km is approx 82.6% -->
<div aria-valuemax="15" aria-valuemin="0" aria-valuenow="12.4" class="bg-neutral-900 h-full rounded-full transition-all duration-500 ease-out" role="progressbar" style="width: 82.6%;"></div>
</div>
<!-- Action Button Row -->
<div class="flex items-center justify-start">
<button class="inline-flex items-center justify-center bg-darkPill hover:bg-neutral-800 active:bg-neutral-950 text-white text-[13px] font-bold px-4 py-2 rounded-full shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-neutral-900" data-purpose="quick-start-button" type="button">
<!-- Play / Runner Mini Icon -->
<svg class="w-3.5 h-3.5 mr-1.5 fill-current" viewbox="0 0 24 24">
<path d="M8 5v14l11-7z"></path>
</svg>
<span>달리기 시작</span>
</button>
</div>
</section>
<!-- END: GlanceWidget4x2 -->
<!-- BEGIN: LauncherAppGrid -->
<!-- App Grid 4x2 representation below widget -->
<section class="w-full mt-7 px-1" data-purpose="app-grid">
<div class="grid grid-cols-4 gap-y-5 gap-x-3.5 place-items-center">
<!-- Row 1: App Placeholders -->
<div class="flex flex-col items-center space-y-1">
<div class="w-14 h-14 bg-white/35 backdrop-blur-md rounded-2xl shadow-sm border border-white/20"></div>
<span class="text-[11px] text-white/75 font-medium truncate max-w-[56px] text-center">전화</span>
</div>
<div class="flex flex-col items-center space-y-1">
<div class="w-14 h-14 bg-white/35 backdrop-blur-md rounded-2xl shadow-sm border border-white/20"></div>
<span class="text-[11px] text-white/75 font-medium truncate max-w-[56px] text-center">메시지</span>
</div>
<div class="flex flex-col items-center space-y-1">
<div class="w-14 h-14 bg-white/35 backdrop-blur-md rounded-2xl shadow-sm border border-white/20"></div>
<span class="text-[11px] text-white/75 font-medium truncate max-w-[56px] text-center">카메라</span>
</div>
<div class="flex flex-col items-center space-y-1">
<div class="w-14 h-14 bg-white/35 backdrop-blur-md rounded-2xl shadow-sm border border-white/20"></div>
<span class="text-[11px] text-white/75 font-medium truncate max-w-[56px] text-center">갤러리</span>
</div>
<!-- Row 2: App Placeholders -->
<div class="flex flex-col items-center space-y-1">
<div class="w-14 h-14 bg-white/35 backdrop-blur-md rounded-2xl shadow-sm border border-white/20"></div>
<span class="text-[11px] text-white/75 font-medium truncate max-w-[56px] text-center">지도</span>
</div>
<div class="flex flex-col items-center space-y-1">
<div class="w-14 h-14 bg-white/35 backdrop-blur-md rounded-2xl shadow-sm border border-white/20"></div>
<span class="text-[11px] text-white/75 font-medium truncate max-w-[56px] text-center">음악</span>
</div>
<div class="flex flex-col items-center space-y-1">
<div class="w-14 h-14 bg-white/35 backdrop-blur-md rounded-2xl shadow-sm border border-white/20"></div>
<span class="text-[11px] text-white/75 font-medium truncate max-w-[56px] text-center">설정</span>
</div>
<div class="flex flex-col items-center space-y-1">
<div class="w-14 h-14 bg-white/35 backdrop-blur-md rounded-2xl shadow-sm border border-white/20"></div>
<span class="text-[11px] text-white/75 font-medium truncate max-w-[56px] text-center">플레이스토어</span>
</div>
</div>
</section>
<!-- END: LauncherAppGrid -->
</div>
<!-- END: MainContentArea -->
<!-- BEGIN: LauncherDockAndNavBar -->
<footer class="w-full flex flex-col items-center pb-2 pt-4" data-purpose="dock-navigation">
<!-- Quick Dock / Search Indicator Bar -->
<div class="w-full bg-white/25 backdrop-blur-md border border-white/20 rounded-full h-11 px-4 flex items-center justify-between mb-4 text-white/70">
<div class="flex items-center space-x-2">
<svg class="w-4 h-4 fill-current text-white/80" viewbox="0 0 24 24">
<path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
</svg>
<span class="text-xs">앱 검색</span>
</div>
<svg class="w-4 h-4 fill-current text-white/80" viewbox="0 0 24 24">
<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path>
</svg>
</div>
<!-- Android Home Navigation Indicator -->
<div class="w-28 h-1 bg-white/50 rounded-full mb-1" data-purpose="home-indicator"></div>
</footer>
<!-- END: LauncherDockAndNavBar -->
</main>
<!-- END: MobileDeviceFrame -->
</body></html>
