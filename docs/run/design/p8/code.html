hild{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface-container-lowest font-body-md text-body-md text-on-surface pt-safe pb-safe flex flex-col min-h-screen"><main class="flex flex-col relative w-full bg-surface-container-lowest min-h-screen flex-1"><div class="flex flex-col w-full relative min-h-full items-center justify-center p-margin">
<div class="absolute inset-0 overflow-hidden pointer-events-none opacity-20">
<div class="w-full h-full flex flex-col justify-between p-6">
<div class="flex justify-between items-center pt-6">
<div class="w-24 h-4 rounded-full bg-surface-container-highest"></div>
<div class="w-8 h-8 rounded-full bg-surface-container-highest"></div>
</div>
<div class="flex flex-col items-center gap-4 my-auto">
<div class="w-48 h-8 rounded-lg bg-surface-container-high"></div>
<div class="w-32 h-16 rounded-xl bg-surface-container-highest"></div>
</div>
<div class="w-full h-14 rounded-2xl bg-surface-container-high mb-8"></div>
</div>
</div>
<div class="relative w-full max-w-[320px] bg-surface-container-high rounded-xl p-6 shadow-2xl z-10">
<div class="flex items-center gap-2 mb-3">
<span class="inline-block w-2 h-2 rounded-full bg-primary-container animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">미완료 세션 발견</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-1">
      진행 중이던 러닝이 있어요
    </h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-6">
      오전 6:40에 시작 · 3.42km
    </p>
<div class="flex flex-col w-full">
<button class="w-full h-14 flex items-center justify-center bg-primary-container text-on-primary-container font-label-lg text-label-lg rounded-xl mb-2.5 transition-transform active:scale-[0.98] select-none cursor-pointer" id="btn-resume" type="button">
        이어서 달리기
      </button>
<button class="w-full h-14 flex items-center justify-center bg-surface-container text-on-surface font-label-lg text-label-lg rounded-xl mb-3.5 transition-transform active:scale-[0.98] select-none cursor-pointer" id="btn-save" type="button">
        저장하고 마치기
      </button>
<button class="w-full py-2 flex items-center justify-center text-error font-label-sm text-label-sm transition-opacity active:opacity-60 select-none cursor-pointer" id="btn-discard" type="button">
        기록 버리기
      </button>
</div>
</div>
<div class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-surface-container-highest text-on-surface font-label-md text-label-md px-4 py-2.5 rounded-full shadow-lg opacity-0 transition-opacity duration-200 pointer-events-none z-30" id="toast">
</div>
<script>
    (function() {
      const toast = document.getElementById('toast');
      function showToast(msg) {
        if (!toast) return;
        toast.textContent = msg;
        toast.classList.remove('opacity-0');
        setTimeout(() => toast.classList.add('opacity-0'), 1800);
      }

      document.getElementById('btn-resume')?.addEventListener('click', () => {
        showToast('러닝 화면으로 이동합니다...');
      });

      document.getElementById('btn-save')?.addEventListener('click', () => {
        showToast('기록을 저장하는 중...');
      });

      document.getElementById('btn-discard')?.addEventListener('click', () => {
        showToast('기록이 삭제되었습니다.');
      });
    })();
  </script>
</div></main></body></html>
