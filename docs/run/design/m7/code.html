<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>약관 및 정책 (M7)</title>
<!-- Tailwind CSS CDN with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind configuration for Obsidian Kinetic palette -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: {
              bg: '#0D0F09',
              surface: '#161911',
              border: '#23281E',
              divider: '#1F241A'
            },
            kinetic: {
              lime: '#D2F832'
            }
          }
        }
      }
    };
  </script>
<!-- Style block for typography and reset overrides -->
<style data-purpose="base-styling">
    body {
      background-color: #0D0F09;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="min-h-screen bg-obsidian-bg flex justify-center items-center p-0 md:p-4">
<!-- BEGIN: MobileDeviceContainer -->
<!-- Container simulating the 360x800 Android mobile frame -->
<main class="w-full max-w-[360px] h-[800px] max-h-screen bg-obsidian-bg flex flex-col justify-between overflow-hidden relative shadow-2xl md:rounded-[36px] md:border md:border-obsidian-border" data-purpose="screen-container">
<!-- BEGIN: ScreenContent -->
<div class="flex-1 flex flex-col">
<!-- BEGIN: Header -->
<!-- Top app bar with back navigation and title -->
<header class="pt-10 pb-5 px-5 flex items-center gap-3 border-b border-obsidian-border/40" data-purpose="screen-header">
<!-- Back Button -->
<button aria-label="뒤로 가기" class="w-9 h-9 -ml-2 flex items-center justify-center text-slate-300 hover:text-white transition-colors active:opacity-70 focus:outline-none" type="button">
<svg class="w-5 h-5 stroke-[2.25]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Screen Title -->
<h1 class="text-[19px] font-bold tracking-tight text-white">
          약관 및 정책
        </h1>
</header>
<!-- END: Header -->
<!-- BEGIN: PolicyListSection -->
<!-- Navigation list for Cloudflare Pages webviews -->
<section aria-label="약관 및 라이선스 목록" class="mt-3 px-3 flex flex-col" data-purpose="policy-links-list">
<ul class="divide-y divide-obsidian-divider list-none m-0 p-0">
<!-- Item 1: 개인정보 처리방침 (Privacy Policy - Emphasized) -->
<li>
<a class="flex items-center justify-between py-4 px-3 rounded-xl transition-all duration-150 hover:bg-obsidian-surface active:bg-obsidian-surface/80 group" data-purpose="privacy-policy-link" href="#">
<span class="text-[15px] font-bold text-white tracking-wide group-hover:text-white">
                개인정보 처리방침
              </span>
<!-- Chevron Right Icon -->
<svg class="w-4 h-4 text-slate-500 group-hover:text-slate-300 transition-colors" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 18l6-6-6-6"></path>
</svg>
</a>
</li>
<!-- Item 2: 서비스 이용약관 (Terms of Service) -->
<li>
<a class="flex items-center justify-between py-4 px-3 rounded-xl transition-all duration-150 hover:bg-obsidian-surface active:bg-obsidian-surface/80 group" data-purpose="terms-of-service-link" href="#">
<span class="text-[15px] font-normal text-slate-300 group-hover:text-white transition-colors">
                서비스 이용약관
              </span>
<!-- Chevron Right Icon -->
<svg class="w-4 h-4 text-slate-500 group-hover:text-slate-300 transition-colors" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 18l6-6-6-6"></path>
</svg>
</a>
</li>
<!-- Item 3: 위치정보 이용약관 (Location Terms) -->
<li>
<a class="flex items-center justify-between py-4 px-3 rounded-xl transition-all duration-150 hover:bg-obsidian-surface active:bg-obsidian-surface/80 group" data-purpose="location-terms-link" href="#">
<span class="text-[15px] font-normal text-slate-300 group-hover:text-white transition-colors">
                위치정보 이용약관
              </span>
<!-- Chevron Right Icon -->
<svg class="w-4 h-4 text-slate-500 group-hover:text-slate-300 transition-colors" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 18l6-6-6-6"></path>
</svg>
</a>
</li>
<!-- Item 4: 오픈소스 라이선스 (Open Source Licenses) -->
<li>
<a class="flex items-center justify-between py-4 px-3 rounded-xl transition-all duration-150 hover:bg-obsidian-surface active:bg-obsidian-surface/80 group" data-purpose="opensource-license-link" href="#">
<span class="text-[15px] font-normal text-slate-300 group-hover:text-white transition-colors">
                오픈소스 라이선스
              </span>
<!-- Chevron Right Icon -->
<svg class="w-4 h-4 text-slate-500 group-hover:text-slate-300 transition-colors" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 18l6-6-6-6"></path>
</svg>
</a>
</li>
</ul>
</section>
<!-- END: PolicyListSection -->
</div>
<!-- END: ScreenContent -->
<!-- BEGIN: AndroidNavigationBar -->
<!-- Minimalist bottom indicator for Android home bar -->
<div class="h-8 w-full flex items-center justify-center pb-2 select-none pointer-events-none" data-purpose="android-gesture-indicator">
<div class="w-28 h-1 rounded-full bg-stone-700/60"></div>
</div>
<!-- END: AndroidNavigationBar -->
</main>
<!-- END: MobileDeviceContainer -->
</body></html>
