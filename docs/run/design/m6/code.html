<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>데이터 · 백업</title>
<!-- Tailwind CSS v3 with Forms & Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Pretendard Font CDN -->
<link as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
<!-- Custom Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appBg: '#0D0F09',
            surface: '#161911',
            fillColor: '#23281C',
            appBorder: '#262B1E',
            primary: '#C8F53A',
            onPrimary: '#141A05',
            danger: '#F87171',
            textPrimary: '#F1F4EA',
            textSecondary: '#A9B09D',
            textTertiary: '#7B8270',
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- Typography and Base Styles -->
<style data-purpose="base-styling">
    body {
      font-family: 'Pretendard', sans-serif;
      font-feature-settings: "tnum" 1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #000000;
      color: #F1F4EA;
    }
    /* Hide default focus outlines and tap highlight on mobile devices */
    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 select-none">
<!-- Mobile Viewport Container (360x800 aspect wrapper) -->
<div class="w-full max-w-[360px] h-[800px] bg-appBg flex flex-col justify-between overflow-hidden shadow-2xl relative">
<!-- BEGIN: TopBar -->
<header class="flex items-center px-4 pt-4 pb-2 z-10" data-purpose="top-navigation-bar">
<!-- Back Button -->
<button aria-label="뒤로 가기" class="flex items-center justify-center p-1 -ml-1 text-textPrimary hover:opacity-80 active:opacity-60 transition" onclick="window.history.back()" type="button">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<polyline points="15 18 9 12 15 6"></polyline>
</svg>
</button>
<!-- Screen Title -->
<h1 class="ml-2 text-base font-bold text-textPrimary tracking-tight">
        데이터 · 백업
      </h1>
</header>
<!-- END: TopBar -->
<!-- BEGIN: MainContent -->
<main class="flex-1 px-4 pt-3 flex flex-col overflow-y-auto" data-purpose="settings-content">
<!-- Status Card -->
<section class="bg-surface border border-appBorder rounded-2xl p-4 mb-3" data-purpose="backup-status-card">
<div class="flex items-center justify-between">
<h2 class="text-base font-bold text-textPrimary leading-snug">
            백업 켜짐
          </h2>
</div>
<p class="text-xs text-textSecondary mt-1 leading-normal font-normal">
          마지막 백업: 오늘 오전 7:12
        </p>
</section>
<!-- Settings List Rows -->
<section class="flex flex-col" data-purpose="backup-settings-list">
<!-- Row 1: Auto Backup Toggle -->
<div class="flex items-center justify-between py-3.5 border-b border-appBorder/50">
<span class="text-sm font-medium text-textPrimary">
            러닝 후 자동 백업
          </span>
<!-- Toggle Switch (Active: primary #C8F53A) -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" data-purpose="auto-backup-toggle" type="checkbox"/>
<div class="w-11 h-6 bg-appBorder rounded-full peer peer-checked:bg-primary transition-colors duration-200"></div>
<div class="absolute left-1 top-1 bg-white peer-checked:bg-onPrimary w-4 h-4 rounded-full transition-transform duration-200 peer-checked:translate-x-5"></div>
</label>
</div>
<!-- Row 2: Backup Now Link -->
<button class="flex items-center justify-between py-3.5 border-b border-appBorder/50 w-full text-left active:opacity-70 transition" data-purpose="backup-now-button" type="button">
<span class="text-sm font-medium text-textPrimary">
            지금 백업하기
          </span>
<svg class="w-4 h-4 text-textTertiary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</button>
<!-- Row 3: Restore Backup Link -->
<button class="flex items-center justify-between py-3.5 border-b border-appBorder/50 w-full text-left active:opacity-70 transition" data-purpose="restore-backup-button" type="button">
<span class="text-sm font-medium text-textPrimary">
            백업에서 복원하기
          </span>
<svg class="w-4 h-4 text-textTertiary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</button>
</section>
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomAction -->
<footer class="p-6 pb-8 flex justify-center items-center" data-purpose="destructive-action-container">
<button class="text-danger text-sm font-medium text-center hover:opacity-80 active:opacity-60 transition" data-purpose="delete-records-button" type="button">
        기기의 모든 기록 삭제
      </button>
</footer>
<!-- END: BottomAction -->
</div>
</body></html>
