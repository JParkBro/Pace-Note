<script>
  // Dynamic sync to ensure bottom tab '기록' is selected and reflects correct active classes
  (function initBottomNavState() {
    const navLinks = document.querySelectorAll('nav a[data-path]');
    navLinks.forEach((link) => {
      const isRecordsTab = link.getAttribute('data-path') === 'records';
      const indicator = link.querySelector('.indicator');
      const icon = link.querySelector('.material-symbols-outlined');
      const label = link.querySelector('span:not(.material-symbols-outlined):not(.indicator)');

      if (isRecordsTab) {
        link.classList.remove('text-outline');
        link.classList.add('text-primary-fixed');
        if (icon) {
          icon.classList.add('text-primary-fixed');
          icon.style.fontVariationSettings = "'FILL' 1";
        }
        if (label) {
          label.classList.add('text-primary-fixed', 'font-semibold');
        }
        if (indicator) {
          indicator.classList.remove('opacity-0');
          indicator.classList.add('opacity-100');
        }
      } else {
        link.classList.add('text-outline');
        link.classList.remove('text-primary-fixed');
        if (icon) {
          icon.classList.remove('text-primary-fixed');
          icon.style.fontVariationSettings = "'FILL' 0";
        }
        if (label) {
          label.classList.remove('text-primary-fixed', 'font-semibold');
        }
        if (indicator) {
          indicator.classList.add('opacity-0');
          indicator.classList.remove('opacity-100');
        }
      }
    });
  })();
