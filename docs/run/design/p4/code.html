", "letterSpacing": "-0.02em", "fontWeight": "600" }] } } } };</script><style>

      min-height: max(884px, 100dvh);

  </style>
  </head><body class="bg-surface-container-lowest text-on-surface font-body-md text-body-md flex flex-col min-h-screen selection:bg-primary-fixed selection:text-on-primary-fixed"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface-container-lowest"><div class="flex flex-col w-full px-6 pt-4 pb-10 select-none items-center justify-between min-h-[740px]">
<!-- Top: Status Pill Badge -->
<div class="flex flex-col items-center w-full">
<div class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-surface-container-high">
<span class="w-2 h-2 rounded-full bg-primary-fixed animate-pulse"></span>
<span class="font-label-md text-label-md text-primary-fixed tracking-tight">일시정지됨</span>
</div>
<!-- Metric: 거리 (km) -->
<div class="flex flex-col items-center mt-5 w-full">
<span class="font-label-md text-label-md text-on-surface-variant">거리 (km)</span>
<div class="font-display-hero text-display-hero text-tertiary tabular-nums tracking-tighter leading-none mt-1">
        3.42
      </div>
</div>
<!-- Secondary 2-Up Metrics: 시간 & 평균 페이스 -->
<div class="grid grid-cols-2 w-full max-w-[312px] mt-6 text-center">
<div class="flex flex-col items-center">
<span class="font-metric-medium text-metric-medium text-tertiary tabular-nums">20:31</span>
<span class="font-label-md text-label-md text-on-surface-variant mt-1">시간</span>
</div>
<div class="flex flex-col items-center">
<span class="font-metric-medium text-metric-medium text-tertiary tabular-nums">5′58″</span>
<span class="font-label-md text-label-md text-on-surface-variant mt-1">평균 페이스</span>
</div>
</div>
</div>
<!-- Minimalist Route Canvas Block -->
<div class="w-full max-w-[328px] h-52 bg-surface-container-low rounded-xl relative p-4 flex flex-col justify-between my-auto overflow-hidden">
<!-- Subtle Coordinate & Signal Badges -->
<div class="flex items-center justify-between w-full z-10">
<div class="flex items-center gap-1 text-outline">
<span class="material-symbols-outlined text-[15px]">sensors</span>
<span class="font-label-sm text-label-sm tracking-wide">GPS 정밀 측정 중</span>
</div>
<span class="font-label-sm text-label-sm text-outline tabular-nums">남산 야외 둘레길</span>
</div>
<!-- Pure Minimalist GPS Polyline Vector Path -->
<div class="absolute inset-0 flex items-center justify-center p-6">
<svg class="w-full h-full" fill="none" viewbox="0 0 280 140" xmlns="http://www.w3.org/2000/svg">
<!-- Route Trail Path -->
<path d="M 32 108 C 50 18, 110 32, 140 84 C 170 136, 218 80, 246 64" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5"></path>
<!-- Start Point Marker -->
<circle class="fill-primary-fixed" cx="32" cy="108" r="4.5"></circle>
<!-- Current / Paused Location Halo & Core Marker -->
<circle class="stroke-primary-fixed fill-none" cx="246" cy="64" r="8" stroke-dasharray="2 2" stroke-width="1.5"></circle>
<circle class="fill-primary" cx="246" cy="64" r="4"></circle>
</svg>
</div>
<!-- Footprint Metrics Indicator -->
<div class="flex items-center justify-between w-full z-10">
<div class="flex items-center gap-1.5">
<span class="w-1.5 h-1.5 rounded-full bg-primary-fixed"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant">출발 지점</span>
</div>
<div class="flex items-center gap-1.5">
<span class="font-label-sm text-label-sm text-on-surface-variant">현재 위치 (정지)</span>
<span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span>
</div>
</div>
</div>
<!-- Bottom Control Area: Resume & Stop Action Zone -->
<div class="flex flex-col items-center w-full gap-3">
<div class="flex items-center justify-center gap-8 w-full">
<!-- Resume Button -->
<button aria-label="달리기 재개" class="w-[72px] h-[72px] rounded-full bg-primary-container active:scale-95 flex items-center justify-center transition-transform cursor-pointer" id="resume-btn" type="button">
<span class="material-symbols-outlined text-on-primary-fixed text-[38px] ml-1" style="font-variation-settings: 'FILL' 1;">
          play_arrow
        </span>
</button>
<!-- Stop (Long Press) Button with Progress Indicator -->
<div class="relative w-[72px] h-[72px] flex items-center justify-center">
<!-- SVG Radial Long-Press Track -->
<svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewbox="0 0 72 72">
<circle class="stroke-surface-variant fill-none" cx="36" cy="36" r="33" stroke-width="2.5"></circle>
<circle class="stroke-error fill-none transition-[stroke-dashoffset] duration-75 ease-linear" cx="36" cy="36" id="stop-progress-ring" r="33" stroke-dasharray="207.34" stroke-dashoffset="207.34" stroke-linecap="round" stroke-width="3"></circle>
</svg>
<button aria-label="달리기 종료 (길게 누르기)" class="w-[62px] h-[62px] rounded-full bg-surface-container-high active:bg-surface-bright flex items-center justify-center transition-colors cursor-pointer select-none" id="stop-btn" type="button">
<span class="material-symbols-outlined text-tertiary text-[26px]" style="font-variation-settings: 'FILL' 1;">
            square
          </span>
</button>
</div>
</div>
<!-- Long-press Caption Notice -->
<p class="font-body-sm text-body-sm text-on-surface-variant transition-colors duration-200" id="caption-label">
      종료는 길게 누르기
    </p>
</div>
</div>
<script>
  (function() {
    const stopBtn = document.getElementById('stop-btn');
    const ring = document.getElementById('stop-progress-ring');
    const caption = document.getElementById('caption-label');
    const resumeBtn = document.getElementById('resume-btn');
    
    const circumference = 2 * Math.PI * 33; // ~207.34
    let pressTimer = null;
    let startTime = 0;
    const requiredDuration = 1800; // 1.8 seconds

    function step() {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(elapsed / requiredDuration, 1);
      const offset = circumference * (1 - progress);
      ring.style.strokeDashoffset = offset;

      if (progress < 1) {
        pressTimer = requestAnimationFrame(step);
      } else {
        // Complete run action
        caption.textContent = '러닝이 완료되었습니다';
        caption.classList.remove('text-on-surface-variant');
        caption.classList.add('text-primary-fixed');
        if (navigator.vibrate) navigator.vibrate([40, 60, 100]);
      }
    }

    function startPress(e) {
      e.preventDefault();
      startTime = Date.now();
      caption.textContent = '손을 떼지 마세요...';
      caption.classList.add('text-tertiary');
      if (navigator.vibrate) navigator.vibrate(25);
      pressTimer = requestAnimationFrame(step);
    }

    function cancelPress() {
      if (pressTimer) {
        cancelAnimationFrame(pressTimer);
        pressTimer = null;
      }
      ring.style.strokeDashoffset = circumference;
      caption.textContent = '종료는 길게 누르기';
      caption.classList.remove('text-tertiary', 'text-primary-fixed');
      caption.classList.add('text-on-surface-variant');
    }

    if (stopBtn) {
      stopBtn.addEventListener('mousedown', startPress);
      stopBtn.addEventListener('touchstart', startPress, { passive: false });
      window.addEventListener('mouseup', cancelPress);
      window.addEventListener('touchend', cancelPress);
      window.addEventListener('touchcancel', cancelPress);
    }

    if (resumeBtn) {
      resumeBtn.addEventListener('click', () => {
        if (navigator.vibrate) navigator.vibrate(35);
      });
    }
  })();
</script></main></body></html>
