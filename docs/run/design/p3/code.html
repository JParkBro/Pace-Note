<html class="dark" lang="ko"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100..900&display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#0d0f09;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-variant": "#34362e", "on-secondary-fixed": "#002111", "on-tertiary": "#2a3414", "tertiary": "#ffffff", "on-surface-variant": "#c4c9ae", "on-primary-container": "#556d00", "on-primary-fixed": "#161f00", "secondary-fixed": "#9ef5c0", "primary-fixed": "#c6f338", "outline": "#8e937b", "error-container": "#93000a", "tertiary-container": "#dbe8ba", "primary-container": "#c6f338", "inverse-surface": "#e3e3d8", "on-secondary": "#003920", "background": "#12140e", "surface-container": "#1e201a", "on-primary": "#283500", "error": "#ffb4ab", "inverse-primary": "#506600", "secondary": "#82d8a5", "on-tertiary-fixed": "#151f03", "on-error": "#690005", "primary": "#ffffff", "tertiary-fixed-dim": "#bfcca0", "secondary-fixed-dim": "#82d8a5", "surface-bright": "#383a32", "inverse-on-surface": "#2f312a", "on-tertiary-container": "#5d6944", "outline-variant": "#444935", "secondary-container": "#006a40", "primary-fixed-dim": "#abd611", "on-error-container": "#ffdad6", "surface-container-low": "#1a1c16", "on-surface": "#e3e3d8", "surface-dim": "#12140e", "surface-container-highest": "#34362e", "on-secondary-fixed-variant": "#005231", "surface-tint": "#abd611", "on-primary-fixed-variant": "#3c4d00", "on-background": "#e3e3d8", "surface-container-high": "#292b24", "on-tertiary-fixed-variant": "#404b29", "surface": "#12140e", "tertiary-fixed": "#dbe8ba", "surface-container-lowest" ", "letterSpacing": "-0.02em", "fontWeight": "600" }] } } } };</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface-container-lowest text-on-surface font-body-md text-body-md flex flex-col min-h-screen selection:bg-primary-fixed selection:text-on-primary-fixed"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface-container-lowest"><div class="flex flex-col w-full px-6 pt-4 pb-10 justify-between select-none relative" id="running-tracker-app">
<div class="flex flex-col w-full">
<!-- Top Action / Lock Status Bar -->
<div class="flex items-center justify-end w-full h-10">
<button aria-label="화면 잠금" class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center transition-all duration-200 active:scale-95" id="screen-lock-btn" type="button">
<span class="material-symbols-outlined text-[20px] text-primary-fixed" id="lock-icon" style="font-variation-settings: 'FILL' 1;">lock</span>
</button>
</div>
<!-- Primary Distance Metric Block -->
<div class="flex flex-col items-center justify-center mt-2">
<span class="text-on-surface-variant font-label-md text-label-md tracking-wider">거리 (km)</span>
<h1 class="text-tertiary font-display-hero text-display-hero tracking-tighter tabular-nums mt-1 leading-none" id="metric-distance">
        3.42
      </h1>
</div>
<!-- Secondary Telemetry (Split Stats) -->
<div class="grid grid-cols-2 gap-4 w-full mt-6 text-center">
<div class="flex flex-col items-center">
<span class="text-tertiary font-metric-large text-metric-large tabular-nums tracking-tight leading-none" id="metric-duration">
          20:31
        </span>
<span class="text-on-surface-variant font-label-sm text-label-sm tracking-wide mt-2">시간</span>
</div>
<div class="flex flex-col items-center">
<span class="text-tertiary font-metric-large text-metric-large tabular-nums tracking-tight leading-none" id="metric-pace">
          5'55"
        </span>
<span class="text-on-surface-variant font-label-sm text-label-sm tracking-wide mt-2">현재 페이스</span>
</div>
</div>
<!-- Pure Minimalist Vector Route Canvas (Zero map clutter) -->
<div class="w-full h-52 bg-surface-container-low rounded-2xl relative overflow-hidden mt-8 flex items-center justify-center">
<!-- Ambient GPS Track Vector -->
<svg class="w-full h-full p-6 overflow-visible" fill="none" viewbox="0 0 280 140" xmlns="http://www.w3.org/2000/svg">
<!-- Background Track Guide Subtle Shadow/Track Echo -->
<path class="opacity-40" d="M 28 112 C 55 42, 98 18, 142 62 C 182 102, 222 108, 252 68" stroke="#34362e" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"></path>
<!-- Live Running Active Polyline Path -->
<path class="transition-all duration-700 ease-out" d="M 28 112 C 55 42, 98 18, 142 62 C 182 102, 222 108, 252 68" id="gps-live-path" stroke="#ffffff" stroke-dasharray="320" stroke-dashoffset="0" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.5"></path>
<!-- Start Coordinate Marker -->
<circle cx="28" cy="112" fill="#c6f338" r="4.5"></circle>
<circle cx="28" cy="112" fill="#c6f338" fill-opacity="0.25" r="8"></circle>
<!-- Current Head Position Indicator (Live Pulsing Halo) -->
<g id="current-position-marker">
<circle cx="252" cy="68" fill="#c6f338" fill-opacity="0.2" r="14">
<animate attributename="r" dur="2s" repeatcount="indefinite" values="8;16;8"></animate>
<animate attributename="fill-opacity" dur="2s" repeatcount="indefinite" values="0.35;0.05;0.35"></animate>
</circle>
<circle cx="252" cy="68" fill="#c6f338" r="6"></circle>
<circle cx="252" cy="68" fill="#161f00" r="2.5"></circle>
</g>
</svg>
<!-- Live GPS Signal Micro Tag -->
<div class="absolute top-3.5 right-4 flex items-center gap-1.5 bg-surface-container-high px-2.5 py-1 rounded-full">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-pulse"></span>
<span class="text-on-surface font-label-sm text-label-sm">GPS 정밀 수신</span>
</div>
</div>
</div>
<!-- Bottom Run Control Deck -->
<div class="flex flex-col items-center justify-center w-full mt-10">
<div class="relative flex items-center justify-center">
<!-- Ripple Ring for Motion Guidance -->
<div class="absolute -inset-2 rounded-full bg-primary-container opacity-20 blur-sm pointer-events-none"></div>
<!-- Main Pause Button (Large Tactile Target for Hands in Motion) -->
<button aria-label="달리기 일시정지" class="relative w-20 h-20 rounded-full bg-primary-container text-on-primary-fixed flex items-center justify-center shadow-lg active:scale-90 transition-transform duration-150 focus:outline-none" id="pause-toggle-btn" type="button">
<span class="material-symbols-outlined text-[36px] select-none pointer-events-none" style="font-variation-settings: 'FILL' 1;">
          pause
        </span>
</button>
</div>
<!-- Gentle Subtitle Guide -->
<span class="text-on-surface-variant font-label-sm text-label-sm mt-3 tracking-normal">
      탭하여 일시정지
    </span>
</div>
</div>
<script>
  (() => {
    let seconds = 1231; // 20 min 31 sec
    let distance = 3.42;
    let isPaused = false;
    let isLocked = false;

    const durationEl = document.getElementById('metric-duration');
    const distanceEl = document.getElementById('metric-distance');
    const pauseBtn = document.getElementById('pause-toggle-btn');
    const lockBtn = document.getElementById('screen-lock-btn');
    const lockIcon = document.getElementById('lock-icon');

    // Run Telemetry Counter
    const timer = setInterval(() => {
      if (isPaused || isLocked) return;
      seconds += 1;
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      durationEl.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

      // Micro Distance accumulation for living feel
      if (seconds % 6 === 0) {
        distance += 0.01;
        distanceEl.textContent = distance.toFixed(2);
      }
    }, 1000);

    // Screen Lock Toggle
    lockBtn.addEventListener('click', () => {
      isLocked = !isLocked;
      if (isLocked) {
        lockIcon.textContent = 'lock_clock';
        lockBtn.classList.replace('bg-surface-container-high', 'bg-surface-variant');
        pauseBtn.disabled = true;
        pauseBtn.classList.add('opacity-40');
      } else {
        lockIcon.textContent = 'lock';
        lockBtn.classList.replace('bg-surface-variant', 'bg-surface-container-high');
        pauseBtn.disabled = false;
        pauseBtn.classList.remove('opacity-40');
      }
    });

    // Pause/Resume Tactile Micro-feedback
    pauseBtn.addEventListener('click', () => {
      if (isLocked) return;
      isPaused = !isPaused;
      const icon = pauseBtn.querySelector('.material-symbols-outlined');
      if (isPaused) {
        icon.textContent = 'play_arrow';
      } else {
        icon.textContent = 'pause';
      }
    });
  })();
</script></main></body></html>
