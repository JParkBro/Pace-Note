<script>
  (function() {
    // Synchronize bottom nav active state to Profile tab ('내 정보')
    const navLinks = document.querySelectorAll('nav a[data-path]');
    navLinks.forEach(link => {
      const isProfile = link.getAttribute('data-path') === 'profile';
      const icon = link.querySelector('.material-symbols-outlined');
      const label = link.querySelector('span:nth-child(2)');
      const dot = link.querySelector('.indicator');

      if (isProfile) {
        link.classList.remove('text-outline');
        link.classList.add('text-primary-fixed');
        if (dot) dot.classList.replace('opacity-0', 'opacity-100');
        if (icon) icon.style.fontVariationSettings = "'FILL' 1";
      } else {
        link.classList.add('text-outline');
        link.classList.remove('text-primary-fixed');
        if (dot) dot.classList.replace('opacity-100', 'opacity-0');
        if (icon) icon.style.fontVariationSettings = "'FILL' 0";
      }
    });

    // Tactile micro-interaction feedback on Google button
    const loginBtn = document.getElementById('googleLoginBtn');
    if (loginBtn) {
      loginBtn.addEventListener('click', () => {
        const textSpan = loginBtn.querySelector('span');
        if (textSpan) {
          const originalText = textSpan.textContent;
          textSpan.textContent = '동기화 연결 중...';
          setTimeout(() => {
            textSpan.textContent = originalText;
          }, 1400);
        }
      });
    }
  })();
