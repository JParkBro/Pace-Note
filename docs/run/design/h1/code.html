<script>
  // Dynamic Tab Activation: Ensure "홈" is highlighted per shell contract
  (function () {
    const navLinks = document.querySelectorAll('nav a[data-path]');
    navLinks.forEach((link) => {
      const isHome = link.getAttribute('data-path') === 'home';
      const indicator = link.querySelector('.indicator');
      if (isHome) {
        link.classList.remove('text-outline');
        link.classList.add('text-primary-fixed');
        if (indicator) indicator.classList.remove('opacity-0');
      } else {
        link.classList.remove('text-primary-fixed');
        link.classList.add('text-outline');
        if (indicator) indicator.classList.add('opacity-0');
      }
    });

    // Circular progress stroke animation micro-interaction
    requestAnimationFrame(() => {
      const ring = document.getElementById('weeklyProgressRing');
      if (ring) {
        const circumference = 427.2;
        const progress = 12.4 / 15.0; // ~0.8266
        const offset = circumference * (1 - progress);
        ring.style.strokeDashoffset = offset.toFixed(1);
      }
    });
  })();
