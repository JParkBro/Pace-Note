<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100..900&display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#0d0f09;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-variant": "#34362e", "on-secondary-fixed": "#002111", "on-tertiary": "#2a3414", "tertiary": "#ffffff", "on-surface-variant": "#c4c9ae", "on-primary-container": "#556d00", "on-primary-fixed": "#161f00", "secondary-fixed": "#9ef5c0", "primary-fixed": "#c6f338", "outline": "#8e937b", "error-container": "#93000a", "tertiary-container": "#dbe8ba", "primary-container": "#c6f338", "inverse-surface": "#e3e3d8", "on-secondary": "#003920", "background": "#12140e", "surface-container": "#1e201a", "on-primary": "#283500", "error": "#ffb4ab", "inverse-primary": "#506600", "secondary": "#82d8a5", "on-tertiary-fixed": "#151f03", "on-error": "#690005", "primary": "#ffffff", "tertiary-fixed-dim": "#bfcca0", "secondary-fixed-dim": "#82d8a5", "surface-bright": "#383a32", "inverse-on-surface": "#2f312a", "on-tertiary-container": "#5d6944", "outline-variant": "#444935", "secondary-container": "#006a40", "primary-fixed-dim": "#abd611", "on-error-container": "#ffdad6", "surface-container-low": "#1a1c16", "on-surface": "#e3e3d8", "surface-dim": "#12140e", "surface-container-highest": "#34362e", "on-secondary-fixed-variant": "#005231", "surface-tint": "#abd611", "on-primary-fixed-variant": "#3c4d00", "on-background": "#e3e3d8", "surface-container-high": "#292b24", "on-tertiary-fixed-variant": "#404b29", "surface": "#12140e", "tertiary-fixed": "#dbe8ba", "surface-container-lowest": "#0d0f09", "on-secondary-container": "#90e7b2" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xs": "0.25rem", "gutter-sm": "0.5rem", "space-lg": "1.25rem", "gutter": "0.75rem", "space-sm": "0.5rem", "space-xl": "1.75rem", "margin-sm": "0.75rem", "space-md": "1rem", "margin": "1rem" }, "fontFamily": { "body-sm": ["Pretendard"], "headline-sm": ["Pretendard"], "display-hero-mobile": ["Pretendard"], "headline-md": ["Pretendard"], "headline-lg": ["Pretendard"], "body-md": ["Pretendard"], "body-lg": ["Pretendard"], "metric-large": ["Pretendard"], "label-lg": ["Pretendard"], "display-hero": ["Pretendard"], "label-md": ["Pretendard"], "label-sm": ["Pretendard"], "metric-medium": ["Pretendard"] }, "fontSize": { "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }], "headline-sm": ["16px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "600" }], "display-hero-mobile": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "headline-md": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-lg": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "metric-large": ["36px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-lg": ["15px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "600" }], "display-hero": ["56px", { "lineHeight": "60px", "letterSpacing": "-0.04em", "fontWeight": "700" }], "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "500" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "metric-medium": ["26px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }] } } } };</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface-container-lowest text-on-surface font-body-md text-body-md flex flex-col min-h-screen selection:bg-primary-fixed selection:text-on-primary-fixed"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface-container-lowest"><div class="flex flex-col w-full select-none cursor-pointer" id="countdown-screen">
<div class="relative w-full flex flex-col justify-between items-center py-12 px-6 overflow-hidden" style="min-height: 800px; height: 100%;">
<div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-40">
<div class="w-72 h-72 rounded-full bg-surface-container-high transition-transform duration-1000 ease-out scale-90 opacity-20" id="pulse-ring"></div>
</div>
<div class="w-full flex justify-between items-center z-10">
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-low text-on-surface-variant font-label-sm text-label-sm">
<span class="w-1.5 h-1.5 rounded-full bg-primary-fixed animate-ping"></span>
<span class="tracking-wide uppercase">GPS 연결됨</span>
</div>
<button class="px-3 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant hover:text-on-surface font-label-sm text-label-sm transition-colors" id="skip-btn" type="button">
        건너뛰기
      </button>
</div>
<div class="flex flex-col items-center justify-center my-auto z-10 text-center">
<div class="relative flex items-center justify-center">
<span class="text-tertiary font-display-hero tracking-tighter tabular-nums transition-all duration-300 transform scale-100 select-none" id="countdown-number" style="font-size: 160px; line-height: 1;">
          3
        </span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-4 transition-opacity duration-300" id="countdown-hint">
        화면을 탭하면 바로 시작
      </p>
</div>
<div class="w-full flex flex-col items-center gap-2 z-10 opacity-70">
<div class="flex items-center gap-1.5">
<span class="w-1.5 h-1.5 rounded-full bg-primary-fixed" id="dot-1"></span>
<span class="w-1.5 h-1.5 rounded-full bg-surface-variant" id="dot-2"></span>
<span class="w-1.5 h-1.5 rounded-full bg-surface-variant" id="dot-3"></span>
</div>
<span class="font-label-sm text-label-sm text-outline">호흡에 집중하세요</span>
</div>
</div>
</div>
<script>
(() => {
  const countEl = document.getElementById('countdown-number');
  const ringEl = document.getElementById('pulse-ring');
  const screenEl = document.getElementById('countdown-screen');
  const skipBtn = document.getElementById('skip-btn');
  const hintEl = document.getElementById('countdown-hint');
  const dot1 = document.getElementById('dot-1');
  const dot2 = document.getElementById('dot-2');
  const dot3 = document.getElementById('dot-3');

  let currentCount = 3;
  let timer = null;
  let isDone = false;

  const updateDots = (val) => {
    if (!dot1 || !dot2 || !dot3) return;
    const activeClass = 'bg-primary-fixed';
    const inactiveClass = 'bg-surface-variant';
    dot1.className = `w-1.5 h-1.5 rounded-full ${val <= 3 ? activeClass : inactiveClass}`;
    dot2.className = `w-1.5 h-1.5 rounded-full ${val <= 2 ? activeClass : inactiveClass}`;
    dot3.className = `w-1.5 h-1.5 rounded-full ${val <= 1 ? activeClass : inactiveClass}`;
  };

  const triggerAnimation = () => {
    if (!countEl || !ringEl) return;
    countEl.classList.remove('scale-100');
    countEl.classList.add('scale-110');
    ringEl.classList.remove('scale-90', 'opacity-20');
    ringEl.classList.add('scale-125', 'opacity-60');

    setTimeout(() => {
      countEl.classList.remove('scale-110');
      countEl.classList.add('scale-100');
      ringEl.classList.remove('scale-125', 'opacity-60');
      ringEl.classList.add('scale-90', 'opacity-20');
    }, 280);
  };

  const finishCountdown = () => {
    if (isDone) return;
    isDone = true;
    clearInterval(timer);
    countEl.textContent = 'RUN';
    countEl.style.fontSize = '88px';
    countEl.classList.add('text-primary-fixed');
    hintEl.textContent = '기록을 시작합니다';
    hintEl.classList.add('text-primary-fixed');
    if (navigator.vibrate) {
      navigator.vibrate([80, 40, 120]);
    }
  };

  const tick = () => {
    currentCount--;
    if (currentCount > 0) {
      countEl.textContent = currentCount;
      updateDots(currentCount);
      triggerAnimation();
      if (navigator.vibrate) {
        navigator.vibrate(40);
      }
    } else {
      finishCountdown();
    }
  };

  timer = setInterval(tick, 1000);

  screenEl.addEventListener('click', (e) => {
    if (e.target === skipBtn) return;
    finishCountdown();
  });

  skipBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    finishCountdown();
  });
})();
</script></main></body></html>
