<script>
  function openShareSheet() {
    const backdrop = document.getElementById('shareSheetBackdrop');
    const container = document.getElementById('shareSheetContainer');
    backdrop.classList.remove('hidden');
    requestAnimationFrame(() => {
      backdrop.classList.remove('opacity-0');
      backdrop.classList.add('opacity-100');
      container.classList.remove('translate-y-full');
      container.classList.add('translate-y-0');
    });
  }

  function closeShareSheet() {
    const backdrop = document.getElementById('shareSheetBackdrop');
    const container = document.getElementById('shareSheetContainer');
    backdrop.classList.add('opacity-0');
    backdrop.classList.remove('opacity-100');
    container.classList.add('translate-y-full');
    container.classList.remove('translate-y-0');
    setTimeout(() => {
      backdrop.classList.add('hidden');
    }, 300);
  }

  function setBgStyle(mode) {
    const card = document.getElementById('previewCard');
    if (mode === 'transparent') {
      card.classList.remove('bg-surface-container');
      card.classList.add('bg-black/30', 'backdrop-blur-md');
    } else {
      card.classList.remove('bg-black/30', 'backdrop-blur-md');
      card.classList.add('bg-surface-container');
    }
  }

  function handleSaveImage() {
    alert('갤러리에 카드가 저장되었습니다.');
    closeShareSheet();
  }

  function handleShare() {
    if (navigator.share) {
      navigator.share({
        title: '오늘의 러닝 기록',
        text: '5.21 km | 30:12 | 5′48″ 페이스 완주!',
      }).catch(() => {});
    } else {
      alert('공유 링크가 클립보드에 복사되었습니다.');
    }
  }
