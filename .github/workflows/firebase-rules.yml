name: Firebase rules
on:
  pull_request:
    paths:
      - "firebase/**"
      - ".github/workflows/firebase-rules.yml"

permissions:
  contents: read

concurrency:
  group: firebase-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rules-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v7
      # @firebase/rules-unit-testing 6은 Node 24.12 이상
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      # Firestore 에뮬레이터는 Java 21 이상
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # demo-run 가짜 프로젝트라 실제 Firebase에 닿지 않는다
      - name: Rules tests
        run: npm test
